name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Equation tests and reference snapshot
        run: python -m pytest core
      - name: Reference comparison report
        run: python validation/compare.py
